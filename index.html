<script>
/* Boot watchdog: if the app has not started after a few seconds (half-finished upload, stale cache), offer a repair button. */
(function(){
  var errs=[];
  addEventListener('error',function(e){var t=e.target;errs.push(t&&t.src?('Could not load '+t.src.split('/').pop().split('?')[0]):(e.message||'error'));},true);
  window.__repair=function(){
    var done=function(){location.reload();};
    var p=[];
    if('serviceWorker' in navigator) p.push(navigator.serviceWorker.getRegistrations().then(function(r){return Promise.all(r.map(function(x){return x.unregister();}));}));
    if(window.caches) p.push(caches.keys().then(function(k){return Promise.all(k.map(function(x){return caches.delete(x);}));}));
    [].forEach.call(document.querySelectorAll('script[src],link[rel=stylesheet]'),function(el){var u=el.src||el.href;if(u.indexOf(location.origin)===0&&window.fetch)p.push(fetch(u,{cache:'reload'}).catch(function(){}));});
    Promise.all(p).then(done,done);
  };
  setTimeout(function(){
    if(!document.getElementById('boot')) return;
    var m=document.getElementById('main');
    m.innerHTML='<div style="padding:24px;font-family:sans-serif;line-height:1.5"><h2>The app did not start</h2><p>This usually means the files on GitHub are only partly uploaded, or an old version is stuck in the cache.</p><p><button onclick="__repair()" style="font-size:1.1em;padding:10px 18px">Clear cache and reload</button></p><p style="font-size:.85em;opacity:.7">Your progress and sync settings are kept.</p><pre style="white-space:pre-wrap;font-size:.8em;opacity:.7"></pre></div>';
    m.querySelector('pre').textContent=errs.slice(0,6).join('\n');
  },6000);
})();
</script>
