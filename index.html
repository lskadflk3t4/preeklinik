{t:"Glucocorticoid excess|Excès de glucocorticoïdes|Glukokortikoidexzess",
v:"A 46-year-old woman on long-term high-dose prednisolone has central obesity, thin skin, proximal muscle weakness and new hyperglycemia.|Une femme de 46 ans sous prednisolone à forte dose au long cours présente obésité centrale, peau fine, faiblesse musculaire proximale et hyperglycémie récente.|Eine 46-jährige Frau unter langfristiger hochdosierter Prednisolontherapie hat Stammfettsucht, dünne Haut, proximale Muskelschwäche und neue Hyperglykämie.",
qs:[{q:"Why is her blood glucose high?|Pourquoi sa glycémie est-elle élevée ?|Warum ist ihre Blutglucose hoch?",o:["Glucocorticoids induce PEPCK/G6Pase, supply amino acids from muscle and cause insulin resistance|Les glucocorticoïdes induisent PEPCK/G6Pase, fournissent des acides aminés musculaires et causent une insulinorésistance|Glukokortikoide induzieren PEPCK/G6Pase, liefern Aminosäuren aus dem Muskel und verursachen Insulinresistenz","They destroy β-cells|Ils détruisent les cellules β|Sie zerstören β-Zellen","They block glucagon|Ils bloquent le glucagon|Sie blockieren Glucagon","They increase intestinal glucose absorption|Ils augmentent l'absorption intestinale du glucose|Sie steigern die intestinale Glucoseaufnahme"],
x:"Steroid-induced diabetes typically causes afternoon/evening hyperglycemia after morning dosing.|Le diabète cortico-induit donne typiquement une hyperglycémie l'après-midi/le soir après une prise matinale.|Steroiddiabetes zeigt typischerweise nachmittags/abends Hyperglykämie nach morgendlicher Gabe."},
{q:"Why the proximal muscle weakness?|Pourquoi la faiblesse musculaire proximale ?|Warum die proximale Muskelschwäche?",o:["Cortisol drives muscle proteolysis to supply gluconeogenic amino acids|Le cortisol stimule la protéolyse musculaire pour fournir des acides aminés néoglucogéniques|Cortisol treibt die Muskelproteolyse an, um glukoneogene Aminosäuren zu liefern","Muscle hypoglycemia|Hypoglycémie musculaire|Muskelhypoglykämie","Ketone accumulation|Accumulation de corps cétoniques|Ketonkörperanhäufung","Potassium excess|Excès de potassium|Kaliumüberschuss"],
x:"Type II fibres are mainly affected; serum CK is usually normal.|Les fibres de type II sont surtout atteintes ; la CK est habituellement normale.|Vor allem Typ-II-Fasern sind betroffen; CK ist meist normal."}]},

{t:"Refeeding syndrome|Syndrome de renutrition inappropriée|Refeeding-Syndrom",
v:"A severely malnourished 19-year-old is started on high-glucose IV feeding. On day 2 she is weak, confused and in heart failure; phosphate 0.3 mmol/L.|Une patiente de 19 ans sévèrement dénutrie reçoit une nutrition IV riche en glucose. Au 2ᵉ jour : faiblesse, confusion, insuffisance cardiaque ; phosphate 0,3 mmol/L.|Eine schwer mangelernährte 19-Jährige erhält glucosereiche i.v. Ernährung. Am Tag 2 ist sie schwach, verwirrt und herzinsuffizient; Phosphat 0,3 mmol/L.",
qs:[{q:"Mechanism?|Mécanisme ?|Mechanismus?",o:["Insulin drives glucose and phosphate into cells; phosphorylated intermediates and ATP synthesis use up the depleted phosphate|L'insuline fait entrer glucose et phosphate dans les cellules ; les intermédiaires phosphorylés et la synthèse d'ATP consomment le phosphate déjà épuisé|Insulin treibt Glucose und Phosphat in die Zellen; phosphorylierte Zwischenprodukte und ATP-Synthese verbrauchen das ohnehin knappe Phosphat","Ketone bodies surge|Flambée des corps cétoniques|Ketonkörperanstieg","Glucagon surge|Pic de glucagon|Glucagonanstieg","Urea cycle failure|Défaillance du cycle de l'urée|Versagen des Harnstoffzyklus"],
x:"Also low K⁺ and Mg²⁺ (moved into cells). Start feeding slowly and replace electrolytes.|Aussi K⁺ et Mg²⁺ bas (entrent dans les cellules). Renourrir lentement et corriger les électrolytes.|Auch K⁺ und Mg²⁺ sinken (Verschiebung in die Zellen). Langsam aufbauen und Elektrolyte ersetzen."},
{q:"Which vitamin should be given before feeding, and why?|Quelle vitamine donner avant la renutrition, et pourquoi ?|Welches Vitamin sollte vor der Ernährung gegeben werden und warum?",o:["Thiamine: glucose oxidation through PDH and α-KGDH needs TPP|Thiamine : l'oxydation du glucose via PDH et α-CGDH nécessite la TPP|Thiamin: Glucoseoxidation über PDH und α-KGDH braucht TPP","Vitamin C for collagen|Vitamine C pour le collagène|Vitamin C für Kollagen","Vitamin K for clotting|Vitamine K pour la coagulation|Vitamin K für die Gerinnung","Vitamin A for vision|Vitamine A pour la vision|Vitamin A für das Sehen"],
x:"Thiamine stores are small and are rapidly consumed when carbohydrate flux restarts.|Les réserves de thiamine sont faibles et s'épuisent vite à la reprise du flux glucidique.|Thiaminspeicher sind klein und werden beim Wiederanlaufen des Kohlenhydratflusses schnell verbraucht."}]},

{t:"Vitamin B12 deficiency|Carence en vitamine B12|Vitamin-B12-Mangel",
v:"A 62-year-old vegan for 15 years has fatigue, tingling feet and unsteady gait. Megaloblastic anemia; homocysteine ↑ and methylmalonic acid ↑.|Un homme de 62 ans, végan depuis 15 ans, présente fatigue, fourmillements des pieds et marche instable. Anémie mégaloblastique ; homocystéine ↑ et acide méthylmalonique ↑.|Ein 62-Jähriger, seit 15 Jahren vegan, hat Müdigkeit, Kribbeln in den Füßen und Gangunsicherheit. Megaloblastäre Anämie; Homocystein ↑ und Methylmalonsäure ↑.",
qs:[{q:"Which finding separates B12 deficiency from folate deficiency?|Quel résultat distingue la carence en B12 de la carence en folates ?|Welcher Befund unterscheidet B12- von Folatmangel?",o:["Raised methylmalonic acid|Acide méthylmalonique élevé|Erhöhte Methylmalonsäure","Raised homocysteine|Homocystéine élevée|Erhöhtes Homocystein","Megaloblastic anemia|Anémie mégaloblastique|Megaloblastäre Anämie","Hypersegmented neutrophils|Neutrophiles hypersegmentés|Hypersegmentierte Neutrophile"],
x:"Methylmalonyl-CoA mutase needs adenosyl-B12; methionine synthase needs both B12 and folate, so homocysteine rises in both.|La méthylmalonyl-CoA mutase nécessite l'adénosyl-B12 ; la méthionine synthase nécessite B12 et folates : l'homocystéine augmente dans les deux carences.|Methylmalonyl-CoA-Mutase braucht Adenosyl-B12; Methioninsynthase braucht B12 und Folat, daher steigt Homocystein bei beiden."},
{q:"Why does the anemia appear even though folate intake is good?|Pourquoi l'anémie apparaît-elle malgré un bon apport en folates ?|Warum entsteht die Anämie trotz guter Folatzufuhr?",o:["Folate is trapped as 5-methyl-THF (methyl trap), so DNA synthesis lacks usable folate|Les folates sont piégés sous forme de 5-méthyl-THF (piège à méthyle) : la synthèse d'ADN manque de folates utilisables|Folat bleibt als 5-Methyl-THF gefangen (Methylfalle), der DNA-Synthese fehlt nutzbares Folat","B12 is needed for heme synthesis|La B12 est nécessaire à la synthèse de l'hème|B12 wird für die Hämsynthese gebraucht","B12 is part of hemoglobin|La B12 fait partie de l'hémoglobine|B12 ist Bestandteil des Hämoglobins","Folate is destroyed by B12 deficiency|Les folates sont détruits par la carence en B12|Folat wird durch B12-Mangel zerstört"],
x:"Giving folate alone may correct the anemia but not the neurological damage (subacute combined degeneration).|Donner des folates seuls peut corriger l'anémie mais pas l'atteinte neurologique (sclérose combinée de la moelle).|Folatgabe allein kann die Anämie korrigieren, aber nicht den Nervenschaden (funikuläre Myelose)."}]}

{t:"Tall teenager with a dislocated lens|Adolescent grand avec luxation du cristallin|Großer Jugendlicher mit Linsenluxation",

  set(k, v){ try { localStorage.setItem('metab.'+k, JSON.stringify(v)); } catch(e){} }
};
function T(x){
  if (x == null) return '';
  if (typeof x === 'function') return x(L);
  if (Array.isArray(x)) return x[LI[L]] != null ? x[LI[L]] : x[0];
  const s = String(x);
  if (s.indexOf('|') >= 0){ const p = s.split('|'); return p[LI[L]] != null ? p[LI[L]] : p[0]; }
  return s;
}
function TEN(x){ const k = L; L = 'en'; const r = T(x); L = k; return r; }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function shuffle(a){ a = a.slice(); for (let i = a.length-1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; } return a; }
function pick(a){ return a[Math.floor(Math.random()*a.length)]; }
function uniq(a){ return Array.from(new Set(a)); }
function fmt(x){ let s = (Math.round(x*100)/100).toString(); if (L !== 'en') s = s.replace('.', ','); return s; }

/* ===================== SCORES ===================== */
/* Progress is kept per device so that syncing (PWA build) merges without conflicts: totals = sum over devices. */
const DEVICE = store.get('device', null) || (() => { const id = 'd' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4); store.set('device', id); return id; })();
let PROG = store.get('prog', null);
if (!PROG || !PROG.devices){ PROG = {resetAt:0, devices:{}}; const old = store.get('scores', null); PROG.devices[DEVICE] = {scores:old || {}, updated:Date.now(), epoch:0, name:''}; store.set('prog', PROG); }
if (!PROG.devices[DEVICE]) PROG.devices[DEVICE] = {scores:{}, updated:0, epoch:PROG.resetAt || 0, name:''};
function totals(){ const t = {}; for (const id in PROG.devices){ const d = PROG.devices[id]; if ((d.epoch || 0) < (PROG.resetAt || 0)) continue;
  for (const k in d.scores){ const s = t[k] || (t[k] = {c:0, n:0}); s.c += d.scores[k].c; s.n += d.scores[k].n; } } return t; }
let SCORES = totals();
let ON_SCORE = null; // hook used by sync.js
function saveProg(){ store.set('prog', PROG); SCORES = totals(); }
function addScore(id, c, n){ const me = PROG.devices[DEVICE]; const s = me.scores[id] || (me.scores[id] = {c:0, n:0}); s.c += c; s.n += n; me.updated = Date.now(); saveProg(); renderHeader(); if (ON_SCORE) ON_SCORE(); }
function resetProgress(){ PROG.resetAt = Date.now(); const nm = PROG.devices[DEVICE].name || ''; PROG.devices = {}; PROG.devices[DEVICE] = {scores:{}, updated:Date.now(), epoch:PROG.resetAt, name:nm}; saveProg(); if (ON_SCORE) ON_SCORE(); }
function mergeProg(remote){
  if (!remote || !remote.devices) return false;
  PROG.resetAt = Math.max(PROG.resetAt || 0, remote.resetAt || 0);
  for (const id in remote.devices){ if (id === DEVICE) continue; const r = remote.devices[id], l = PROG.devices[id]; if (!l || (r.updated || 0) > (l.updated || 0)) PROG.devices[id] = r; }
  const me = PROG.devices[DEVICE]; if ((me.epoch || 0) < PROG.resetAt){ me.scores = {}; me.epoch = PROG.resetAt; me.updated = Date.now(); }
  for (const id in PROG.devices){ if (id !== DEVICE && (PROG.devices[id].epoch || 0) < PROG.resetAt) delete PROG.devices[id]; }
  saveProg(); return true;
}
function scoreChip(id){ const s = SCORES[id]; if (!s || !s.n) return `<span class="chip muted">${u('noneYet')}</span>`;
  const pct = Math.round(100*s.c/s.n); const cls = pct >= 80 ? 'good' : pct >= 50 ? 'warn' : 'bad';
  return `<span class="chip ${cls}">${pct}% · ${s.c}/${s.n}</span>`; }

/* ===================== SHARED UI ===================== */
function pathwaySelect(cur, act, withRandom){
  let h = `<label class="field"><span>${u('pathway')}</span><select data-chg="${act}" id="sel-${act}">`;
  if (withRandom) h += `<option value="__rand">${esc(u('random'))}</option>`;
  for (const c in CATS){ h += `<optgroup label="${esc(T(CATS[c]))}">`;
    P.filter(p => p.cat === c).forEach(p => { h += `<option value="${p.id}"${p.id === cur ? ' selected' : ''}>${esc(T(p.n))}</option>`; });
    h += `</optgroup>`; }
  return h + `</select></label>`;
}
function segmented(name, opts, cur, act){
  return `<div class="seg" role="group" aria-label="${esc(name)}">` + opts.map(o => `<button type="button" class="${o[0] === cur ? 'on' : ''}" data-act="${act}" data-v="${o[0]}" aria-pressed="${o[0] === cur}">${esc(T(o[1]))}</button>`).join('') + `</div>`;
}
function tagsHTML(p, s){
  let h = ''; if (s[5] && s[5].indexOf('i') >= 0) h += `<span class="tag irr">${u('irr')}</span>`;
  if (s[5] && s[5].indexOf('r') >= 0) h += `<span class="tag rl">${u('rl')}</span>`;
  const lc = stepLoc(p, s); if (lc && LOC[lc]) h += `<span class="tag loc">${esc(T(LOC[lc]))}</span>`;
  return h;
}
function rxnHTML(p, i, opt){ opt = opt || {}; const s = p.st[i];
  return `<span class="rxn"><span class="m">${esc(mol(s[0]))}</span><span class="ar">→</span><span class="m">${esc(mol(s[1]))}</span></span>`
    + (opt.noEnz ? '' : `<span class="e">${esc(enz(s[2]))}</span>`)
    + (s[3] && !opt.noSide ? `${sideHTML(s[3])}` : '')
    + (opt.tags ? `<span class="tags">${tagsHTML(p, s)}</span>` : '');
}
/* Pathway map; B = blanks {key:{kind,opts,val,state,ans}} */
function blankSel(key, b){

  let h = `<select class="blank ${cls}" data-chg="d7sel" data-key="${key}" aria-label="${esc(u('choose'))}"${b.state ? ' disabled' : ''}><option value="">${esc(u('choose'))}</option>`;

  h += `</select>`;
  if (b.state === 'no') h += `<span class="fix">→ ${esc(b.kind === 'm' ? mol(b.ans) : enz(b.ans))}</span>`;

}
function mapHTML(p, B){ B = B || {};
  const node = (key, id) => `<li class="node">${B[key] ? blankSel(key, B[key]) : `<span class="m big">${esc(mol(id))}</span>`}</li>`;
  let h = `<ol class="map" aria-label="${esc(T(p.n))}">`;
  p.st.forEach((s, i) => {
    if (i === 0 || s[0] !== p.st[i-1][1]){ if (i > 0) h += `<li class="branch">⤷ ${esc(u('newBranch'))}</li>`; h += node('s'+i, s[0]); }
    h += `<li class="arrow ${locCls(stepLoc(p, s))}${s[5] && s[5].indexOf('i') >= 0 ? ' irrv' : ''}"><span class="stem" aria-hidden="true"></span><div class="ab">`
      + (B['e'+i] ? blankSel('e'+i, B['e'+i]) : `<span class="e">${esc(enz(s[2]))}</span>`)
      + (s[3] ? `${sideHTML(s[3])}` : '') + `<span class="tags">${tagsHTML(p, s)}</span></div></li>`;
    h += node('p'+i, s[1]);
  });
  if (p.cyc) h += `<li class="loop">↺ ${esc(u('backToStart'))}</li>`;
  return h + `</ol>` + legendHTML(p);
}

/* ===== Ordering component (drills 1 and 5) ===== */
function makeOrder(items, fixed){ // items: [{ans, d}] in correct order
  const its = items.map((it, k) => ({uid:'u'+k, ans:it.ans, d:it.d}));
  return {items:its, correct:its.map(i => i.ans), pool:shuffle(its.map(i => i.uid)), seq:[], checked:false, res:[], fixed:fixed || null, msg:null};
}
function descHTML(d){
  if (d.t === 'step') return rxnBlock(PW[d.p], d.i);
  if (d.t === 'enz') return `<span class="e">${esc(enz(d.id))}</span>`;
  if (d.t === 'mol') return `<span class="m">${esc(mol(d.id))}</span>`;
  return `<span class="txt">${esc(T(d.x))}</span>`;
}
function orderHTML(o, ns){
  const get = uid => o.items.find(i => i.uid === uid);
  const off = o.fixed ? 1 : 0;
  let h = `<div class="order"><div class="col seqcol"><div class="col-h">${u('seq')}</div><ol class="seqlist">`;
  if (o.fixed) h += `<li><div class="oitem fixed"><span class="onum">1</span>${descHTML(o.fixed)}<span class="chip muted">${u('fixedStart')}</span></div></li>`;
  o.seq.forEach((uid, k) => { const cls = o.checked ? (o.res[k] ? 'ok' : 'no') : '';
    if (k > 0 || o.fixed) h += seqLink(o, k, get);
    h += `<li><button type="button" class="oitem ${cls}" data-act="ounpick" data-ns="${ns}" data-uid="${uid}"${o.checked ? ' disabled' : ''}><span class="onum">${k+1+off}</span>${descHTML(get(uid).d)}</button></li>`; });
  if (!o.checked){ const left = o.correct.length - o.seq.length;
    for (let g = 0; g < Math.min(left, 3); g++) h += `<li class="ghost"><span class="onum">${o.seq.length + g + 1 + off}</span>${g === 2 && left > 3 ? esc(u('slotLeft', {n:left - 2})) : '…'}</li>`; }
  h += `</ol></div><div class="col poolcol"><div class="col-h">${u('pool')}</div><div class="poollist">`;
  o.pool.forEach(uid => { h += `<button type="button" class="oitem" data-act="opick" data-ns="${ns}" data-uid="${uid}">${descHTML(get(uid).d)}</button>`; });
  if (!o.pool.length) h += `<div class="empty">✓</div>`;
  h += `</div></div></div>`;
  if (!o.checked){ const last = o.seq.length ? get(o.seq[o.seq.length-1]).d : null;
    h += `<div class="obar"><div class="obar-info"><strong>${u('placed', {n:o.seq.length + off, t:o.correct.length + off})}</strong>${last ? `<span class="obar-last">${u('lastPlaced')}: ${esc(lastLabel(last))}</span>` : ''}</div>`
      + `<button type="button" class="btn" data-act="oundo" data-ns="${ns}"${o.seq.length ? '' : ' disabled'}>${u('undo')}</button><button type="button" class="btn" data-act="oclear" data-ns="${ns}"${o.seq.length ? '' : ' disabled'}>${u('clear')}</button>`
      + `<button type="button" class="btn primary" data-act="ocheck" data-ns="${ns}">${u('check')}</button></div>`; }
  if (o.msg) h += `<p class="note warn">${esc(u(o.msg))}</p>`;
  if (o.checked){ const n = o.res.filter(Boolean).length;
    if (n === o.correct.length) h += `<div class="fb ok"><strong>${u('allCorrect')}</strong></div>`;
    else { h += `<div class="fb no"><strong>${u('nCorrect', {n, t:o.correct.length})}</strong><ol class="solution" start="${1+off}">`;
      o.items.forEach(it => { h += `<li>${descHTML(it.d)}</li>`; }); h += `</ol></div>`; } }

}
function seqLink(o, k, get){
  const prevD = k === 0 ? o.fixed : get(o.seq[k - 1]).d, curD = get(o.seq[k]).d;
  if (!o.checked || !prevD || prevD.t !== curD.t || (curD.t !== 'step' && curD.t !== 'mol')) return `<li class="flow" aria-hidden="true"></li>`;
  if (curD.t === 'step'){ const pa = PW[prevD.p].st[prevD.i], cu = PW[curD.p].st[curD.i];
    if (pa[1] === cu[0]) return `<li class="link ok">✓ ${esc(u('linkOk', {m:mol(cu[0])}))}</li>`;

    return `<li class="link no">✗ ${esc(u('linkNo', {a:mol(pa[1]), b:mol(cu[0])}))}</li>`; }
  return o.res[k] ? `<li class="link ok">↓</li>` : `<li class="link no">✗</li>`;
}

/* ===================== D1 PATHWAY RECONSTRUCTION ===================== */
function newD1(pid, mode){
  const prev = S.d1 || {};
  const p = (!pid || pid === '__rand') ? pick(P.filter(x => x.st.length >= 3)) : PW[pid];
  mode = mode || prev.mode || 'cards';
  let eff = mode, msg = null;
  if (mode === 'mol' && !isCont(p)){ eff = 'cards'; msg = 'molModeNA'; }
  let o;
  if (eff === 'cards') o = makeOrder(p.st.map((s, i) => ({ans:'s'+i, d:{t:'step', p:p.id, i}})));
  else if (eff === 'enz') o = makeOrder(p.st.map(s => ({ans:s[2], d:{t:'enz', id:s[2]}})));
  else { let ch = [p.st[0][0]].concat(p.st.map(s => s[1])); if (p.cyc && ch[ch.length-1] === ch[0]) ch.pop();
    o = makeOrder(ch.slice(1).map(id => ({ans:id, d:{t:'mol', id}})), {t:'mol', id:ch[0]}); }
  o.msg = msg;
  S.d1 = {pid:p.id, mode, o, showMap: prev.showMap && prev.pid === p.id ? true : false};
}
function renderD1(){
  if (!S.d1) newD1('glycolysis', 'cards');
  const s = S.d1, p = PW[s.pid];
  let h = `<div class="controls">${pathwaySelect(s.pid, 'd1path', true)}<div class="field"><span>${u('mode')}</span>${segmented(u('mode'), [['cards','modeCards'],['enz','modeEnz'],['mol','modeMol']].map(x => [x[0], U[x[1]]]), s.mode, 'd1mode')}</div></div>`;
  h += infoHTML(p);
  h += `<div class="actions"><button type="button" class="btn" data-act="d1map">${s.showMap ? u('hideMap') : u('showMap')}</button><button type="button" class="btn" data-act="d1new">${u('reshuffle')}</button></div>`;
  if (s.showMap) h += `<div class="card mapcard"><p class="note">${u('studyNote')}</p>${mapHTML(p)}</div>`;
  h += `<div class="card">${orderHTML(s.o, 'd1')}${s.o.items[0] && s.o.items[0].d.t === 'step' ? legendHTML(p) : ''}</div>`;
  if (s.o.checked && !s.showMap) h += `<div class="card mapcard">${mapHTML(p)}</div>`;
  return h;

/* ===================== D2 WHAT HAPPENS NEXT ===================== */
function poolFrom(list, correct, exclude, labelFn){
  const cl = TEN(labelFn(correct)); const seen = new Set([cl]); const out = [];
  for (const x of list){ if (x === correct || (exclude && exclude.indexOf(x) >= 0)) continue; const lb = TEN(labelFn(x)); if (!lb || seen.has(lb)) continue; seen.add(lb); out.push(x); }
  return out;
}
function distract(kind, p, correct, exclude, k){
  k = k || 3;
  const lab = kind === 'm' ? (x => M[x]) : kind === 'e' ? (x => E[x]) : (x => x);
  const fromP = kind === 'm' ? uniq(p.st.flatMap(s => [s[0], s[1]])) : kind === 'e' ? uniq(p.st.map(s => s[2])) : uniq(p.st.map(s => s[3]).filter(Boolean));
  const sameCat = P.filter(q => q.cat === p.cat && q !== p);
  const fromC = kind === 'm' ? uniq(sameCat.flatMap(q => q.st.flatMap(s => [s[0], s[1]]))) : kind === 'e' ? uniq(sameCat.flatMap(q => q.st.map(s => s[2]))) : uniq(sameCat.flatMap(q => q.st.map(s => s[3]).filter(Boolean)));
  const all = kind === 'm' ? Object.keys(M) : kind === 'e' ? Object.keys(E) : uniq(P.flatMap(q => q.st.map(s => s[3]).filter(Boolean)));
  let out = poolFrom(shuffle(fromP), correct, exclude, lab).slice(0, k);
  if (out.length < k){ const more = poolFrom(shuffle(fromC), correct, (exclude || []).concat(out), lab).filter(x => !out.some(o => TEN(lab(o)) === TEN(lab(x)))); out = out.concat(more.slice(0, k - out.length)); }
  if (out.length < k){ const more = poolFrom(shuffle(all), correct, (exclude || []).concat(out), lab).filter(x => !out.some(o => TEN(lab(o)) === TEN(lab(x)))); out = out.concat(more.slice(0, k - out.length)); }
  return out;
}
function newD2(pid){
  const p = (!pid || pid === '__rand') ? pick(P.filter(x => x.st.length >= 3)) : PW[pid];
  S.d2 = {pid:p.id, i:0, ok:0, n:0, q:null}; makeQ2();
}
function makeQ2(){
  const s = S.d2, p = PW[s.pid]; if (s.i >= p.st.length){ s.q = null; return; }
  const st = p.st[s.i]; const types = ['m', 'm', 'e']; if (st[3]) types.push('x');
  const t = pick(types); let correct;
  if (t === 'm') correct = st[1]; else if (t === 'e') correct = st[2]; else correct = st[3];
  const ds = distract(t, p, correct, t === 'm' ? [st[0]] : null);

function solvePH(groups, x){ let lo = 0, hi = 14; for (let i = 0; i < 60; i++){ const m = (lo + hi)/2; if (groups.reduce((a, pk) => a + 1/(1 + Math.pow(10, pk - m)), 0) < x) lo = m; else hi = m; } return (lo + hi)/2; }
function titrPts(groups){ const o = []; for (let ph = 0.4; ph <= 13.6; ph += 0.1) o.push([groups.reduce((a, pk) => a + 1/(1 + Math.pow(10, pk - ph)), 0), ph]); return o; }
function titrPlot(groups, pts){ return plotSVG({x:[0, groups.length], y:[0, 14], xl:tr("Equivalents of OH⁻ added", "Équivalents d'OH⁻ ajoutés", "Zugesetzte OH⁻-Äquivalente"), yl:"pH", xt:groups.map((_, i) => i).concat([groups.length]).map(v => [v, String(v)]), yt:[0, 2, 4, 6, 8, 10, 12, 14], c:[{p:titrPts(groups), cls:'c1'}], pt:pts || []}); }

function pepCharge(seq, pH){ const pos = pk => 1/(1 + Math.pow(10, pH - pk)), neg = pk => -1/(1 + Math.pow(10, pk - pH));
  const parts = [[tr("N-terminus (pKa 8.0)", "extrémité N (pKa 8,0)", "N-Terminus (pKa 8,0)"), pos(8.0)], [tr("C-terminus (pKa 3.1)", "extrémité C (pKa 3,1)", "C-Terminus (pKa 3,1)"), neg(3.1)]];

/* ---------- small language helpers ---------- */
const L3 = f => [0, 1, 2].map(f);

const isAA = id => !!AAI[id] && MOL[id].fam === 'aa';

function mNote(id){ const m = MOL[id];
  if (!isAA(id)) return L3(i => tx(m.x, i));
  const a = AAI[id], f = AAFEAT.filter(z => z[1].indexOf(id) >= 0).slice(0, 2);
  return L3(i => `${a[0][i]} (${a[1]}, ${a[2]}): ${AAC[a[3]][i]}. ${['Side chain', 'Chaîne latérale', 'Seitenkette'][i]}: ${ix(a[4], i)}.` + (a[8] ? ' ' + ['Essential.', 'Essentiel.', 'Essentiell.'][i] : '')

const famOf = id => MOL[id].fam;
const inFam = f => MIDS.filter(id => famOf(id) === f);
const PSEUDO = {CoA:1, R:1, 'R′':1, 'R″':1};

/* ---------- structure drawing ---------- */
let MOLC = store.get('molC', 'skel');                     // 'skel' or 'full' (show C and H labels)
const SUBD = '₀₁₂₃₄₅₆₇₈₉';
const subN = n => n > 1 ? String(n).split('').map(d => SUBD[d]).join('') : '';
const chgTxt = q => q ? (Math.abs(q) > 1 ? Math.abs(q) : '') + (q > 0 ? '+' : '−') : '';
const ELC = {O:'o', N:'n', S:'s', P:'p', I:'i'};
/* opt: {hl:[atom idx…], bl: px per bond, full: bool, title} */
function molSVG(id, opt){

  const n = A_.length, nb = A_.map(() => []);
  B_.forEach(b => { nb[b[0]].push(b[1]); nb[b[1]].push(b[0]); });
  const P = A_.map(a => [a[1]*bl, a[2]*bl]);
  const fs = Math.max(11, Math.round(bl*0.45)), cw = fs*0.62;
  /* which atoms get a text label, and how it is laid out */
  const lab = A_.map((a, i) => {
    const sym = a[0], q = a[3] || 0, h = a[4] || 0, isC = sym === 'C';
    if (isC && !full && !q && nb[i].length) return null;
    const ps = !!PSEUDO[sym];
    const dirs = nb[i].map(j => Math.atan2(P[j][1] - P[i][1], P[j][0] - P[i][0]));
    const free = ang => Math.min(...dirs.map(d => { let x = Math.abs(d - ang) % (2*Math.PI); return x > Math.PI ? 2*Math.PI - x : x; }).concat([9]));
    let hs = 'r';  // side for the H's
    if (h && !ps){ // prefer writing H's beside the atom (OH, HO, NH₃) unless a bond points that way
      if (free(0) >= 1.0) hs = 'r'; else if (free(Math.PI) >= 1.0) hs = 'l';
      else { const cand = [['r', 0], ['l', Math.PI], ['d', Math.PI/2], ['u', -Math.PI/2]]; let best = -1;
        cand.forEach((c, k) => { const f = free(c[1]) - k*0.05; if (f > best + 1e-6){ best = f; hs = c[0]; } }); } }
    let qa = -Math.PI/4;  // charge position (angle)
    if (q){ let best = -1; [-Math.PI/4, -3*Math.PI/4, Math.PI/4, 3*Math.PI/4].forEach(ang => {
        let f = free(ang); if (h && ((hs === 'r' && Math.cos(ang) > 0) || (hs === 'l' && Math.cos(ang) < 0) || (hs === 'u' && Math.sin(ang) < 0) || (hs === 'd' && Math.sin(ang) > 0))) f -= 1.2;
        if (f > best + 1e-6){ best = f; qa = ang; } }); }
    const w = (ps ? sym.length : 1)*cw;

  });

    const hw = L0.w/2 + 2.5, hh = fs*0.55; const tx_ = Math.abs(dx) > 1e-6 ? hw/Math.abs(dx/d) : 1e9, ty_ = Math.abs(dy) > 1e-6 ? hh/Math.abs(dy/d) : 1e9; return Math.min(tx_, ty_, d*0.45); };
  const hl = new Set(opt.hl || []);
  let under = '', bonds = '', texts = '';
  B_.forEach(b => {
    const [i, j, o, w] = b; let [x1, y1] = P[i], [x2, y2] = P[j]; const dx = x2 - x1, dy = y2 - y1, d = Math.hypot(dx, dy) || 1, ux = dx/d, uy = dy/d;
    if (hl.has(i) && hl.has(j)) under += `<line class="mhl" x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}"/>`;
    const c1 = cut(i, j), c2 = cut(j, i); x1 += ux*c1; y1 += uy*c1; x2 -= ux*c2; y2 -= uy*c2;
    const nx = -uy, ny = ux, f = v => v.toFixed(1);
    if (w === 1){ const ww = bl*0.13; bonds += `<polygon class="mw" points="${f(x1)},${f(y1)} ${f(x2 + nx*ww)},${f(y2 + ny*ww)} ${f(x2 - nx*ww)},${f(y2 - ny*ww)}"/>`; return; }
    if (w === 2){ const k = 6; for (let t = 0; t <= k; t++){ const u0 = t/k, cx = x1 + (x2 - x1)*u0, cy = y1 + (y2 - y1)*u0, ww = bl*0.13*u0 + 0.6;
      bonds += `<line class="mb mh" x1="${f(cx + nx*ww)}" y1="${f(cy + ny*ww)}" x2="${f(cx - nx*ww)}" y2="${f(cy - ny*ww)}"/>`; } return; }
    if (o === 1){ bonds += `<line class="mb" x1="${f(x1)}" y1="${f(y1)}" x2="${f(x2)}" y2="${f(y2)}"/>`; return; }
    // double / triple: which side has the other substituents?
    let side = 0; [[i, j], [j, i]].forEach(([a, z]) => nb[a].forEach(k => { if (k === z) return; const s = (P[k][0] - P[i][0])*nx + (P[k][1] - P[i][1])*ny; side += s > 0.01 ? 1 : s < -0.01 ? -1 : 0; }));

      const off = o === 3 ? g*1.1 : g/1.6;
      bonds += `<line class="mb" x1="${f(x1 + nx*off)}" y1="${f(y1 + ny*off)}" x2="${f(x2 + nx*off)}" y2="${f(y2 + ny*off)}"/><line class="mb" x1="${f(x1 - nx*off)}" y1="${f(y1 - ny*off)}" x2="${f(x2 - nx*off)}" y2="${f(y2 - ny*off)}"/>`;
      if (o === 3) bonds += `<line class="mb" x1="${f(x1)}" y1="${f(y1)}" x2="${f(x2)}" y2="${f(y2)}"/>`;
    } else {
      const sg = side > 0 ? 1 : -1, sh = d*0.12, s1 = lab[i] ? 0 : sh, s2 = lab[j] ? 0 : sh;
      bonds += `<line class="mb" x1="${f(x1)}" y1="${f(y1)}" x2="${f(x2)}" y2="${f(y2)}"/><line class="mb" x1="${f(x1 + ux*s1 + nx*g*sg*1.25)}" y1="${f(y1 + uy*s1 + ny*g*sg*1.25)}" x2="${f(x2 - ux*s2 + nx*g*sg*1.25)}" y2="${f(y2 - uy*s2 + ny*g*sg*1.25)}"/>`;
    }
  });
  let x0 = 1e9, y0 = 1e9, x9 = -1e9, y9 = -1e9; const grow = (x, y) => { x0 = Math.min(x0, x); x9 = Math.max(x9, x); y0 = Math.min(y0, y); y9 = Math.max(y9, y); };
  P.forEach(p => grow(p[0], p[1]));
  A_.forEach((a, i) => { const L0 = lab[i]; const [x, y] = P[i];
    if (hl.has(i)) under += `<circle class="mhl" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${(bl*0.32).toFixed(1)}"/>`;
    if (!L0) return;
    const cls = L0.ps ? 'mt mps' : 'mt' + (ELC[L0.sym] ? ' el-' + ELC[L0.sym] : '');
    texts += `<text class="${cls}" x="${x.toFixed(1)}" y="${y.toFixed(1)}" font-size="${fs}" text-anchor="middle" dominant-baseline="central">${esc(L0.sym)}</text>`;
    grow(x - L0.w/2, y - fs*0.6); grow(x + L0.w/2, y + fs*0.6);

      else if (L0.hs === 'l'){ hx = x - L0.w/2 + 0.5; an = 'end'; grow(hx - hw - 2, y); }
      else if (L0.hs === 'u'){ hy = y - fs*1.05; grow(x, hy - fs*0.6); } else { hy = y + fs*1.05; grow(x, hy + fs*0.7); }
      texts += `<text class="mt${ELC[L0.sym] ? ' el-' + ELC[L0.sym] : ''}" x="${hx.toFixed(1)}" y="${hy.toFixed(1)}" font-size="${fs}" text-anchor="${an}" dominant-baseline="central">${hT}</text>`; }
    if (L0.q){ let r = L0.w/2 + fs*0.35; if (L0.h && ((L0.hs === 'r' && Math.cos(L0.qa) > 0) || (L0.hs === 'l' && Math.cos(L0.qa) < 0))) r += cw*(L0.h > 1 ? 1.6 : 1);
      const qx = x + Math.cos(L0.qa)*r, qy = y + Math.sin(L0.qa)*fs*0.75;
      texts += `<text class="mq" x="${qx.toFixed(1)}" y="${qy.toFixed(1)}" font-size="${(fs*0.78).toFixed(1)}" text-anchor="middle" dominant-baseline="central">${chgTxt(L0.q)}</text>`; grow(qx - 5, qy - 6); grow(qx + 5, qy + 6); }
  });
  const pad = 6, W = x9 - x0 + 2*pad, H = y9 - y0 + 2*pad;
  return `<svg class="molsvg" viewBox="${(x0 - pad).toFixed(1)} ${(y0 - pad).toFixed(1)} ${W.toFixed(1)} ${H.toFixed(1)}" width="${Math.round(W)}" height="${Math.round(H)}" role="img" aria-label="${esc(opt.title || u('molOpt'))}">${under}${bonds}${texts}</svg>`;
}
function rxFig(a, b, bl){ return `<div class="rxfig"><div class="rxm">${molSVG(a, {bl})}</div><div class="rxarrow" aria-hidden="true">→</div><div class="rxm">${molSVG(b, {bl})}</div></div>`; }

/* ---------- question generators ---------- */
function distractIds(id, pool, k){ k = k || 3;
  const cf = (MOL[id].cf || []).filter(z => z !== id && pool.indexOf(z) >= 0);
  const same = shuffle(pool.filter(z => z !== id && famOf(z) === famOf(id) && cf.indexOf(z) < 0));
  const other = shuffle(pool.filter(z => z !== id && famOf(z) !== famOf(id) && cf.indexOf(z) < 0));
  const names = new Set([TEN(mName(id))]), out = [];
  shuffle(cf).concat(same, other).forEach(z => { const nm = TEN(mName(z)); if (out.length < k && !names.has(nm)){ names.add(nm); out.push(z); } });
  return out; }
const qNameT = tr("Name this molecule.", "Nommez cette molécule.", "Wie heißt dieses Molekül?");

  if (tn === 'INPUT' || tn === 'SELECT' || tn === 'TEXTAREA' || (tg && tg.isContentEditable)) return;

const DAY = 864e5, RV_INT = [0, 1, 3, 7, 14, 30], RV_MAX = 200;

function rvActive(){ const c = RVC(); return Object.keys(c).filter(k => !c[k].gone).map(k => c[k]); }
function rvDue(){ const now = Date.now(); return rvActive().filter(c => c.due <= now).sort((a, b) => a.due - b.due); }
function rvMastered(){ const c = RVC(); return Object.keys(c).filter(k => c[k].gone && c[k].ret).length; }
function rvWhen(t){ const d = t - Date.now(); if (d <= 0) return u('rvNow'); const dd = Math.round(d / DAY);

/* ---- snapshot (de)serialisation: functions become plain text so cards survive reloads and sync ---- */
function rvSer(v){
  if (typeof v === 'function'){
    if (v.length === 0){ try { return {__f:String(v())}; } catch(e){ return null; } }
    const k = L, out = []; try { ['en', 'fr', 'de'].forEach(l => { L = l; out.push(String(v(l))); }); } catch(e){ L = k; return null; } L = k; return {__l:out}; }
  if (Array.isArray(v)) return v.map(rvSer);
  if (v && typeof v === 'object'){ const o = {}; for (const k in v){ if (k === 'queue' || k === 'last') continue; const r = rvSer(v[k]); if (r !== undefined) o[k] = r; } return o; }
  return v; }
function rvDe(v){
  if (Array.isArray(v)) return v.map(rvDe);
  if (v && typeof v === 'object'){ if (v.__l) return v.__l.slice(); if (v.__f != null){ const s = v.__f; return () => s; }
    const o = {}; for (const k in v) o[k] = rvDe(v[k]); return o; }
  return v; }

  ocheck:(s, slot) => { const o = slot === 'd5' ? s.ord.o : s.o; o.pool = shuffle(o.pool.concat(o.seq)); o.seq = []; o.checked = false; o.res = []; o.msg = null; },
  d3check:s => { s.sel = []; s.checked = false; },
  d4check:s => { s.ans = {}; s.checked = false; },
  d7check:s => { for (const k in s.B){ s.B[k].val = ''; s.B[k].state = null; } s.checked = false; s.msg = null; },
  bxcheck:s => { s.ans = {}; s.res = null; s.done = false; s.msg = null; },
  bxnum:s => { s.val = ''; s.done = false; s.ok = null; },

const RV_NEXT = ['d1new', 'd2next', 'd2again', 'd2other', 'd3next', 'd4mnext', 'd4pnext', 'd5next', 'd5reord', 'd6next', 'd7new', 'd8next', 'd8mnext', 'd9next', 'bxnext'];

function rvPreview(){ const m = typeof document !== 'undefined' && document.getElementById('main'); if (!m) return '';
  const parts = []; ['.q', '.stmt', '.vignette', '.current', '.info h3'].forEach(sel => { const e = m.querySelector(sel); if (e && parts.length < 2){ const t = (e.innerText || e.textContent).replace(/\s+/g, ' ').trim(); if (t && parts.indexOf(t) < 0) parts.push(t); } });
  const s = parts.join(' — '); return s.length > 160 ? s.slice(0, 157) + '…' : s; }
function rvCapture(slot, act){ try { if (!S[slot]) return; RV_PEND = {slot, act, snap:rvSer(S[slot]), pv:rvPreview()}; } catch(e){ RV_PEND = null; } }
function rvWrap(name, slotOf){ const f = A[name]; if (!f) return;
  A[name] = function(el){ rvCapture(typeof slotOf === 'function' ? slotOf(el) : slotOf, name); try { return f.apply(this, arguments); } finally { RV_PEND = null; } }; }
Object.keys(RV_ANS).forEach(k => rvWrap(k, RV_ANS[k]));
{ const f = SUBS.bxnum; SUBS.bxnum = function(fm){ rvCapture(fm.dataset.id, 'bxnum'); try { return f.apply(this, arguments); } finally { RV_PEND = null; } }; }
{ const f = d9submit; d9submit = function(){ rvCapture('d9', 'd9'); try { return f.apply(this, arguments); } finally { RV_PEND = null; } }; }
RV_NEXT.forEach(k => { const f = A[k]; if (!f) return; A[k] = function(){ if (REV && REV.cur && VIEW === REV.drill){ rvNext(); return; } return f.apply(this, arguments); }; });
Object.keys(CHG).forEach(k => { if (RV_KEEP_CHG.indexOf(k) >= 0) return; const f = CHG[k]; CHG[k] = function(){ if (REV) REV = null; return f.apply(this, arguments); }; });

/* ---- hook into scoring ---- */
const _rvAdd = addScore;
addScore = function(id, c, n){
  const p = RV_PEND;
  if (p && n){
    if (REV && REV.cur && !REV.res && VIEW === REV.drill) rvGrade(c >= n);
    else if (c < n){ const cards = RVC(); const act = rvActive();
      if (act.length >= RV_MAX){ act.sort((a, b) => a.added - b.added); const old = act[0]; cards[old.id] = {id:old.id, gone:true, u:Date.now()}; }
      const cid = 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
      cards[cid] = {id:cid, d:id, slot:p.slot, act:p.act, snap:p.snap, pv:p.pv, pvl:{[L]:p.pv}, box:0, due:Date.now(), added:Date.now(), u:Date.now()};
      RV_TOAST = Date.now(); }
  }
  _rvAdd(id, c, n);
};
let RV_TOAST = 0;

function rvGrade(ok){ const c = RVC()[REV.cur]; REV.res = ok ? 'ok' : 'no'; if (ok) REV.c++;
  if (!c || c.gone) return;
  if (ok){ c.box = (c.box || 0) + 1; if (c.box >= RV_INT.length){ RVC()[c.id] = {id:c.id, gone:true, ret:true, u:Date.now()}; REV.mast = true; } else { c.due = Date.now() + RV_INT[c.box]*DAY; REV.mast = false; } }
  else { c.box = 0; c.due = Date.now(); }
  rvTouch(c); }

/* ---- sessions ---- */
function rvLoad(id){ const c = RVC()[id]; if (!c || c.gone) return false;
  let st; try { st = rvDe(JSON.parse(JSON.stringify(c.snap))); } catch(e){ return false; }
  const live = S[c.slot];
  if (RV_RESET[c.act]) RV_RESET[c.act](st, c.slot);
  if (c.slot === 'd8' && st.m && st.m.opts){ const key = JSON.stringify(st.m.it); st.m.it = st.m.opts.find(o => JSON.stringify(o) === key) || st.m.it; }
  if (live && BX[c.slot]){ st.queue = live.queue; st.last = live.last; }
  S[c.slot] = st; REV.cur = id; REV.res = null; REV.drill = c.d; return true; }
function rvStart(mode, drill){
  let cards = mode === 'due' ? rvDue() : shuffle(rvActive()); if (drill) cards = cards.filter(c => c.d === drill);
  if (!cards.length) return;
  REV = {queue:cards.map(c => c.id), i:0, n:cards.length, c:0, cur:null, res:null, drill:null, done:0};
  rvNext(true); }
function rvNext(first){
  if (!REV) return;
  if (!first && REV.cur){ const q = REV.queue, ix = q.indexOf(REV.cur); if (ix >= 0) q.splice(ix, 1); if (REV.res === 'no') q.push(REV.cur); if (REV.res) REV.done++; }
  REV.cur = null; REV.res = null; rvSave();
  while (REV.queue.length && !rvLoad(REV.queue[0])) REV.queue.shift();
  if (!REV.queue.length || REV.done >= REV.n * 3){ RV_SUMMARY = {c:REV.c, n:REV.done}; REV = null; goTo('review'); return; }
  REV.i = REV.done + 1;
  if (location.hash === '#' + REV.drill) render(); else location.hash = REV.drill;
  if (typeof window !== 'undefined') window.scrollTo(0, 0); }
let RV_SUMMARY = null;
function rvEnd(){ REV = null; rvSave(); goTo('review'); }

A.rvstart = el => rvStart(el.dataset.v, el.dataset.d || null);
A.rvnext = () => rvNext();
A.rvskip = () => { if (!REV) return; REV.res = null; rvNext(); };
A.rvend = () => rvEnd();
A.rvdel = el => { const c = RVC()[el.dataset.v]; if (c){ RVC()[c.id] = {id:c.id, gone:true, u:Date.now()}; rvSave(); render(); } };
A.rvclear = () => { if (!RV_CLEAR_ARM){ RV_CLEAR_ARM = true; render(); setTimeout(() => { if (RV_CLEAR_ARM){ RV_CLEAR_ARM = false; if (VIEW === 'review') render(); } }, 4000); return; }
  RV_CLEAR_ARM = false; rvActive().forEach(c => { RVC()[c.id] = {id:c.id, gone:true, u:Date.now()}; }); rvSave(); render(); };

/* ---- banner inside a drill during review, toast when a mistake is saved ---- */

  if (r && remote && remote.rv && remote.rv.cards){ if (!PROG.rv) PROG.rv = {cards:{}}; const L0 = RVC(), R = remote.rv.cards;

const VIT = [['TPP','vitamin B1 (thiamine)|la vitamine B1 (thiamine)|Vitamin B1 (Thiamin)'],['PLP','vitamin B6|la vitamine B6|Vitamin B6'],['biotin','vitamin B7 (biotin)|la vitamine B7 (biotine)|Vitamin B7 (Biotin)'],
  ['B12','vitamin B12|la vitamine B12|Vitamin B12'],['BH4','tetrahydrobiopterin (made by the body)|la tétrahydrobioptérine (fabriquée par l\'organisme)|Tetrahydrobiopterin (körpereigen)'],['vitamin C','vitamin C|la vitamine C|Vitamin C'],['THF','folate (vitamin B9)|le folate (vitamine B9)|Folat (Vitamin B9)']];
function fxu(k, v){ let s = T(FX[k]); if (v) for (const key in v) s = s.split('{' + key + '}').join(v[key]); return s; }
function sideFacts(side){
  if (!side) return [];
  const en = TEN(side), out = [], seen = new Set();
  const add = (k, v) => { if (seen.has(k)) return; seen.add(k); out.push(fxu(k, v)); };
  const num = (str, tk) => { const m = new RegExp('(\\d+)\\s*' + tk.replace(/[⁺()]/g, x => '\\' + x)).exec(str); return m ? +m[1] : 1; };
  en.split(';').forEach(cl => {
    const parts = cl.split(/→|⇌/); const prodSet = new Set();
    const has = (s, tk) => new RegExp('(^|[^A-Za-z0-9(])' + tk.replace(/[⁺()]/g, x => '\\' + x) + '(?![A-Za-z0-9₂⁺])').test(s);
    if (parts.length > 1){
      for (let k = 0; k < parts.length - 1; k++){ const a = parts[k], b = parts[k + 1];
        if (has(a, 'ATP') && has(b, 'AMP')) add('atpAmp'); else if (has(a, 'ATP') && !prodSet.has('ATP')) add('atpUse', {n:num(a, 'ATP')});
        if (has(a, 'ADP') && has(b, 'ATP')){ add('atpMake', {n:num(b, 'ATP')}); prodSet.add('ATP'); }
        if (has(b, 'GTP')){ add('gtpMake'); prodSet.add('GTP'); } else if (has(a, 'GTP')) add('gtpUse');
        if (has(a, 'UTP')) add('utpUse');
        if (has(a, 'NAD⁺') && has(b, 'NADH')){ add('nadhMake'); prodSet.add('NADH'); } else if (has(a, 'NADH') && has(b, 'NAD⁺') && !prodSet.has('NADH')) add('nadhUse');
        if ((has(a, 'NADP⁺') && has(b, 'NADPH')) || (has(a, 'NAD(P)⁺') && has(b, 'NAD(P)H'))) add('nadphMake'); else if (has(a, 'NADPH') && has(b, 'NADP⁺')) add('nadphUse');
        if (has(a, 'FAD') && has(b, 'FADH₂')) add('fadMake');
        if ((has(a, 'CO₂') || has(a, 'HCO₃⁻')) && k === 0 && !/−\s*\d*\s*CO₂/.test(a)) add('co2In');
        if (has(b, 'Pi') && !has(b, 'NADH')) add('piOut');
      }
    } else {
      if (has(cl, 'NADPH')) add('nadphUse');
      if (has(cl, 'ATP') && /\d\s*ATP|^\s*ATP/.test(cl)) add('atpUse', {n:num(cl, 'ATP')});
    }
    if (/−\s*\d*\s*CO₂/.test(cl)) add('co2Out');
    if (/\+\s*(CO₂|HCO₃⁻)/.test(cl)) add('co2In');
    if (/−\s*H₂O/.test(cl)) add('h2oOut');
    if (/\+\s*H₂O/.test(cl)) add('h2oIn');
    if (/(^|[^A-Za-z])O₂/.test(cl)) add('o2');
    const lft = cl.split(/→|⇌/)[0]; if (/\+\s*Pi\b/.test(lft) && !/DP|NAD|ATP/.test(lft)) add('piIn');
    if (/−\s*Pi\b/.test(cl)) add('piOut');
  });
  VIT.forEach(v => { if (new RegExp('(^|[^A-Za-z0-9-])' + v[0] + '([^A-Za-z0-9]|$)').test(en) && !seen.has('vit' + v[0])){ seen.add('vit' + v[0]); out.push(fxu('vit', {c:v[0], v:T(v[1])})); } });
  return out;
}

/* ---------- enzyme name decoder (rule matched on the English name) ---------- */
const NAMECLUE = [
  [/aminotransferase|transaminase/, "'Aminotransferase' = moves an amino group (–NH₂) from one molecule to another; always needs vitamin B6 (PLP).|« Aminotransférase » = déplace un groupe aminé (–NH₂) d'une molécule à une autre ; a toujours besoin de vitamine B6 (PLP).|„Aminotransferase“ = überträgt eine Aminogruppe (–NH₂) von einem Molekül auf ein anderes; braucht immer Vitamin B6 (PLP)."],
  [/carboxykinase/, "'Carboxy-kinase' = takes off a CO₂ and puts on a phosphate from GTP in one go.|« Carboxykinase » = retire un CO₂ et ajoute un phosphate venant du GTP en une seule fois.|„Carboxykinase“ = spaltet CO₂ ab und hängt in einem Schritt ein Phosphat aus GTP an."],
  [/phosphatase/, "'Phosphatase' = cuts a phosphate off with water (the opposite of a kinase).|« Phosphatase » = retire un phosphate grâce à l'eau (l'inverse d'une kinase).|„Phosphatase“ = spaltet ein Phosphat mit Wasser ab (das Gegenteil einer Kinase)."],
  [/phosphorylase/, "'Phosphorylase' = breaks a bond using free phosphate (Pi) instead of water, so the piece comes off already phosphorylated.|« Phosphorylase » = coupe une liaison avec du phosphate libre (Pi) au lieu de l'eau : le morceau sort déjà phosphorylé.|„Phosphorylase“ = spaltet eine Bindung mit freiem Phosphat (Pi) statt mit Wasser, das Stück kommt schon phosphoryliert heraus."],
  [/decarboxylase/, "'De-carboxyl-ase' = removes CO₂.|« Dé-carboxyl-ase » = retire du CO₂.|„De-carboxyl-ase“ = spaltet CO₂ ab."],
  [/carboxylase/, "'Carboxylase' = adds CO₂ (as bicarbonate); usually needs biotin and ATP.|« Carboxylase » = ajoute du CO₂ (bicarbonate) ; a souvent besoin de biotine et d'ATP.|„Carboxylase“ = hängt CO₂ (als Bicarbonat) an; braucht meist Biotin und ATP."],
  [/dehydratase/, "'De-hydrat-ase' = pulls water out of the molecule.|« Déshydratase » = retire de l'eau de la molécule.|„Dehydratase“ = spaltet Wasser aus dem Molekül ab."],
  [/hydratase|fumarase|aconitase|enolase/, "This enzyme adds or removes water to move or create a double bond.|Cette enzyme ajoute ou retire de l'eau pour déplacer ou créer une double liaison.|Dieses Enzym lagert Wasser an oder spaltet es ab, um eine Doppelbindung zu bilden oder zu verschieben."],
  [/dehydrogenase/, "'De-hydrogen-ase' = takes hydrogen (electrons) off the molecule and gives them to NAD⁺ or FAD – or the reverse.|« Déshydrogénase » = enlève de l'hydrogène (des électrons) à la molécule et les donne au NAD⁺ ou au FAD – ou l'inverse.|„Dehydrogenase“ = nimmt dem Molekül Wasserstoff (Elektronen) weg und gibt sie an NAD⁺ oder FAD – oder umgekehrt."],
  [/reductase/, "'Reductase' = adds electrons (a reduction), usually taken from NADPH.|« Réductase » = ajoute des électrons (une réduction), le plus souvent pris au NADPH.|„Reduktase“ = fügt Elektronen hinzu (eine Reduktion), meist aus NADPH."],
  [/oxidase|oxygenase|hydroxylase/, "'Oxidase / oxygenase / hydroxylase' = uses oxygen (O₂) to oxidize the molecule or add an –OH group.|« Oxydase / oxygénase / hydroxylase » = utilise l'oxygène (O₂) pour oxyder la molécule ou ajouter un groupe –OH.|„Oxidase / Oxygenase / Hydroxylase“ = nutzt Sauerstoff (O₂), um das Molekül zu oxidieren oder eine –OH-Gruppe anzuhängen."],
  [/synthetase/, "'Synthetase' = joins two pieces and pays with ATP.|« Synthétase » = assemble deux morceaux en payant avec de l'ATP.|„Synthetase“ = verbindet zwei Teile und bezahlt mit ATP."],
  [/synthase/, "'Synthase' = builds a new molecule by joining pieces, without spending ATP directly.|« Synthase » = construit une molécule en assemblant des morceaux, sans dépenser directement d'ATP.|„Synthase“ = baut ein Molekül aus Teilen auf, ohne direkt ATP zu verbrauchen."],
  [/mutase/, "'Mutase' = moves a group (often a phosphate) to another spot on the same molecule.|« Mutase » = déplace un groupe (souvent un phosphate) à un autre endroit de la même molécule.|„Mutase“ = verschiebt eine Gruppe (oft ein Phosphat) an eine andere Stelle im selben Molekül."],
  [/epimerase/, "'Epimerase' = flips the arrangement at just one carbon.|« Épimérase » = inverse la configuration d'un seul carbone.|„Epimerase“ = dreht die Anordnung an nur einem Kohlenstoff um."],
  [/isomerase/, "'Isomerase' = rearranges the same atoms into a different shape (same formula, new structure).|« Isomérase » = réarrange les mêmes atomes autrement (même formule, nouvelle structure).|„Isomerase“ = ordnet dieselben Atome anders an (gleiche Formel, neue Struktur)."],
  [/aldolase|lyase|desmolase/, "'Aldolase / lyase' = splits a molecule in two (or joins two) without water or redox.|« Aldolase / lyase » = coupe une molécule en deux (ou en assemble deux) sans eau ni oxydoréduction.|„Aldolase / Lyase“ = spaltet ein Molekül in zwei Teile (oder verbindet zwei) ohne Wasser oder Redoxreaktion."],
  [/kinase/, "'Kinase' = puts a phosphate from ATP (or GTP) onto a molecule.|« Kinase » = ajoute sur une molécule un phosphate venant de l'ATP (ou du GTP).|„Kinase“ = hängt ein Phosphat aus ATP (oder GTP) an ein Molekül."],
  [/deaminase/, "'De-amin-ase' = removes an amino group as ammonia.|« Désaminase » = retire un groupe aminé sous forme d'ammoniac.|„Desaminase“ = spaltet eine Aminogruppe als Ammoniak ab."],
  [/thiolase|thiolysis/, "'Thiolase' = cuts a carbon chain using CoA (releases acetyl-CoA).|« Thiolase » = coupe une chaîne carbonée avec du CoA (libère de l'acétyl-CoA).|„Thiolase“ = spaltet eine Kohlenstoffkette mit CoA (setzt Acetyl-CoA frei)."],
  [/lipase/, "'Lipase' = cuts fats (ester bonds) with water.|« Lipase » = coupe les graisses (liaisons ester) avec de l'eau.|„Lipase“ = spaltet Fette (Esterbindungen) mit Wasser."],
  [/transferase|transacetylase|transacylase|transketolase|transaldolase|translocase/, "'Trans-…-ase' = carries a group from one molecule (or place) to another.|« Trans-…-ase » = transfère un groupe d'une molécule (ou d'un endroit) à une autre.|„Trans-…-ase“ = überträgt eine Gruppe von einem Molekül (oder Ort) auf ein anderes."],
  [/transcarbamo?ylase/, "'Trans-carbamoyl-ase' = hands a carbamoyl group (from carbamoyl phosphate) to another molecule.|« Transcarbamylase » = transfère un groupe carbamoyle (venant du carbamoyl-phosphate) à une autre molécule.|„Transcarbamylase“ = überträgt eine Carbamoylgruppe (aus Carbamoylphosphat) auf ein anderes Molekül."],
  [/ferrochelatase/, "'Ferro-chelat-ase' = clips iron (Fe²⁺) into the centre of the ring.|« Ferrochélatase » = insère le fer (Fe²⁺) au centre de l'anneau.|„Ferrochelatase“ = setzt Eisen (Fe²⁺) in die Mitte des Rings ein."],
  [/desaturase/, "'Desaturase' = makes a double bond in a carbon chain.|« Désaturase » = crée une double liaison dans une chaîne carbonée.|„Desaturase“ = bildet eine Doppelbindung in einer Kohlenstoffkette."],
  [/branching enzyme/, "The branching enzyme moves a short block of glucose units to start a side branch.|L'enzyme branchante déplace un petit bloc d'unités de glucose pour créer une ramification.|Das Verzweigungsenzym verschiebt einen kurzen Block Glucoseeinheiten und startet so einen Seitenast."],
  [/hydrolase|lactase|sidase|esterase|arginase|nucleotidase|lactonase|ceramidase|myelinase|sulfatase|neuraminidase|sialidase|hexosaminidase|dutpase|orotase/, "This enzyme cuts a bond with water (hydrolysis).|Cette enzyme coupe une liaison avec de l'eau (hydrolyse).|Dieses Enzym spaltet eine Bindung mit Wasser (Hydrolyse)."]
];
function nameClue(eid){ const en = String(TEN(E[eid]) || '').toLowerCase(); for (const r of NAMECLUE) if (r[0].test(en)) return T(r[1]); return ''; }

function stepPlain(p, i, opt){ opt = opt || {};
  const s = p.st[i]; const facts = sideFacts(s[3]);
  let h = `<p>${esc(fxu('turns', {e:enz(s[2]), a:mol(s[0]), b:mol(s[1])}))}`;
  if (facts.length) h += ' ' + esc(fxu('also', {x:facts.join('; ')}));
  h += `</p>`;
  if (s[5] && s[5].indexOf('i') >= 0) h += `<p class="nf irr">⇥ ${esc(fxu('irr'))}</p>`;
  if (s[5] && s[5].indexOf('r') >= 0) h += `<p class="nf rl">⏱ ${esc(fxu('rl'))}</p>`;
  const lc = stepLoc(p, s); if (lc && LOC[lc] && !opt.noLoc) h += `<p class="nf"><span class="lgloc ${locCls(lc)}">${esc(T(LOC[lc]))}</span></p>`;
  const nc = nameClue(s[2]); if (nc && !opt.noName) h += `<p class="nf name"><strong>${u('nName')}:</strong> ${esc(nc)}</p>`;
  return h;
}

/* ---------- energy strip: one cell per step ---------- */
function energyBadges(side){ if (!side) return ''; const en = TEN(side); const b = [];
  sideFacts(side); // keeps logic in one place for the sentences; badges use a light parser
  en.split(';').forEach(cl => { const ps = cl.split(/→|⇌/);
    for (let k = 0; k < ps.length - 1; k++){ const a = ps[k], c = ps[k + 1];
      if (/ATP/.test(a) && /A[DM]P/.test(c)) b.push(['en', '−ATP']); if (/ADP/.test(a) && /ATP/.test(c)) b.push(['en', '+ATP']);
      if (/GDP/.test(a) && /GTP/.test(c)) b.push(['en', '+GTP']); if (/GTP/.test(a) && /GDP/.test(c)) b.push(['en', '−GTP']);
      if (/NAD⁺/.test(a) && /NADH/.test(c)) b.push(['ec', '+NADH']); if (/NADH/.test(a) && /NAD⁺/.test(c) && !/NAD⁺/.test(a)) b.push(['ec', '−NADH']);
      if (/NADP⁺/.test(a) && /NADPH/.test(c)) b.push(['ec', '+NADPH']); if (/NADPH/.test(a) && /NADP⁺/.test(c)) b.push(['ec', '−NADPH']);
      if (/FAD(?!H)/.test(a) && /FADH₂/.test(c)) b.push(['ec', '+FADH₂']); } });
  if (/−\s*\d*\s*CO₂/.test(en)) b.push(['sm', 'CO₂↑']);
  return uniq(b.map(x => x.join(':'))).map(x => { const [c, t] = x.split(':'); return `<span class="tk tk-${c}">${t}</span>`; }).join('');
}
function energyStrip(p){
  const cells = p.st.map((s, i) => ({i, b:energyBadges(s[3])})).filter(c => c.b);
  if (!cells.length) return '';
  return `<div class="estrip">` + p.st.map((s, i) => { const b = energyBadges(s[3]);
    return `<div class="ecell${b ? ' on' : ''} ${locCls(stepLoc(p, s))}" title="${esc(enz(s[2]))}"><span class="enum">${i + 1}</span>${b || '<span class="edot">·</span>'}</div>`; }).join('') + `</div>`;
}

/* ---------- notes box ---------- */
function notesBox(parts){ const sec = (k, v) => v ? `<section class="nsec"><h4>${u(k)}</h4>${v}</section>` : '';
  const body = sec('nAsk', parts.ask) + sec('nYour', parts.your) + sec('nWhat', parts.what) + sec('nHow', parts.how) + (parts.extra || '');
  if (!body) return '';
  return `<details class="notes" open><summary><span class="nicon" aria-hidden="true">💡</span>${u('nTitle')}</summary><div class="nbody">${body}</div></details>`;
}
const P_ = x => `<p>${esc(T(x))}</p>`;
const LIST = xs => `<ul class="nlist">${xs.map(x => `<li>${esc(T(x))}</li>`).join('')}</ul>`;

  d2m:"Look at the enzyme's name and what else happens: a kinase adds a phosphate, a dehydrogenase removes hydrogen, a decarboxylase removes CO₂. Apply that change to the current molecule.|Regardez le nom de l'enzyme et ce qui se passe à côté : une kinase ajoute un phosphate, une déshydrogénase retire de l'hydrogène, une décarboxylase retire du CO₂. Appliquez ce changement à la molécule actuelle.|Schau auf den Enzymnamen und was sonst passiert: Eine Kinase hängt Phosphat an, eine Dehydrogenase nimmt Wasserstoff weg, eine Decarboxylase spaltet CO₂ ab. Wende diese Änderung auf das aktuelle Molekül an.",
  d2e:"Most enzymes are named 'substrate (or product) + what it does'. Find the option that names the current molecule (or the next one) and the right kind of change.|La plupart des enzymes s'appellent « substrat (ou produit) + ce qu'elle fait ». Cherchez l'option qui nomme la molécule actuelle (ou la suivante) et le bon type de changement.|Die meisten Enzyme heißen „Substrat (oder Produkt) + was es tut“. Suche die Option, die das aktuelle (oder nächste) Molekül und die passende Art der Änderung nennt.",
  d2x:"Ask: does this step oxidize (→ NADH/FADH₂), spend or make ATP, add or remove water, or add or remove CO₂? Compare the two molecules to see what changed.|Demandez-vous : cette étape oxyde-t-elle (→ NADH/FADH₂), dépense-t-elle ou fabrique-t-elle de l'ATP, ajoute-t-elle ou retire-t-elle de l'eau ou du CO₂ ? Comparez les deux molécules pour voir ce qui change.|Frag dich: Wird oxidiert (→ NADH/FADH₂), ATP verbraucht oder gebildet, Wasser oder CO₂ angehängt oder abgespalten? Vergleiche die beiden Moleküle, um die Änderung zu sehen.",
  d3:["Think of each organ's 'job': the liver keeps blood glucose steady and processes everything; muscle burns fuel for movement and stores glycogen only for itself; the brain needs a constant supply of glucose (ketones in long fasting); adipose tissue stores and releases fat; the kidney filters and can make glucose; red cells have no mitochondria, so they only use glycolysis.|Pensez au « métier » de chaque organe : le foie stabilise la glycémie et transforme tout ; le muscle brûle du carburant pour bouger et garde son glycogène pour lui ; le cerveau a besoin de glucose en continu (cétones en jeûne prolongé) ; le tissu adipeux stocke et libère les graisses ; le rein filtre et peut fabriquer du glucose ; les globules rouges n'ont pas de mitochondries, donc seulement la glycolyse.|Denk an den „Job“ jedes Organs: Die Leber hält den Blutzucker konstant und verarbeitet alles; der Muskel verbrennt Brennstoff für Bewegung und speichert Glykogen nur für sich; das Gehirn braucht ständig Glucose (bei langem Fasten Ketone); Fettgewebe speichert und gibt Fett ab; die Niere filtert und kann Glucose bilden; Erythrozyten haben keine Mitochondrien und nutzen nur die Glykolyse.",
    "Check the equipment: no mitochondria → no fat burning or ketone use; no glucose-6-phosphatase → cannot release glucose into the blood.|Vérifiez l'équipement : pas de mitochondries → ni oxydation des graisses ni utilisation des cétones ; pas de glucose-6-phosphatase → impossible de libérer du glucose dans le sang.|Prüfe die Ausstattung: keine Mitochondrien → keine Fettverbrennung und keine Ketonnutzung; keine Glucose-6-Phosphatase → kann keine Glucose ins Blut abgeben."],
  d4:["Insulin = 'we just ate': store fuel (glycogen, fat, protein) and take up glucose.|Insuline = « on vient de manger » : stocker (glycogène, graisses, protéines) et capter le glucose.|Insulin = „wir haben gerade gegessen“: Brennstoff speichern (Glykogen, Fett, Protein) und Glucose aufnehmen.",
    "Glucagon = 'blood sugar is low': the liver releases glucose (glycogen breakdown, gluconeogenesis) and burns fat; it barely acts on muscle.|Glucagon = « la glycémie est basse » : le foie libère du glucose (glycogénolyse, néoglucogenèse) et brûle les graisses ; il n'agit presque pas sur le muscle.|Glucagon = „der Blutzucker ist niedrig“: Die Leber gibt Glucose ab (Glykogenabbau, Glukoneogenese) und verbrennt Fett; auf den Muskel wirkt es kaum.",
    "Adrenaline = 'emergency now': release fuel everywhere fast, including muscle glycogen. Cortisol = 'long stress': slowly supply glucose by breaking down protein for gluconeogenesis.|Adrénaline = « urgence immédiate » : libérer vite du carburant partout, y compris le glycogène musculaire. Cortisol = « stress durable » : fournir du glucose lentement en dégradant les protéines pour la néoglucogenèse.|Adrenalin = „Notfall jetzt“: überall schnell Brennstoff freisetzen, auch Muskelglykogen. Cortisol = „Dauerstress“: langsam Glucose liefern, indem Protein für die Glukoneogenese abgebaut wird."],
  d4phos:"Memory trick: phosphate is added by PKA when glucagon or adrenaline call for fuel. So 'release' enzymes are switched ON by phosphate and 'storage' enzymes are switched OFF by it.|Astuce : la PKA ajoute un phosphate quand le glucagon ou l'adrénaline réclament du carburant. Les enzymes de « libération » sont donc ALLUMÉES par le phosphate, celles du « stockage » ÉTEINTES.|Merkhilfe: PKA hängt Phosphat an, wenn Glucagon oder Adrenalin Brennstoff anfordern. „Freisetzungs“-Enzyme werden durch Phosphat EINgeschaltet, „Speicher“-Enzyme AUSgeschaltet.",
  d5c:"Ask three questions: Is insulin high or low? How long since the last meal? Is the person resting or exercising, and how hard? Then match the fuel being used.|Posez-vous trois questions : l'insuline est-elle haute ou basse ? Depuis combien de temps n'a-t-on pas mangé ? La personne est-elle au repos ou en effort, et à quelle intensité ? Puis associez le carburant utilisé.|Stell dir drei Fragen: Ist Insulin hoch oder niedrig? Wie lange ist die letzte Mahlzeit her? Ruht die Person oder bewegt sie sich, und wie stark? Dann ordne den genutzten Brennstoff zu.",
  ord:"Think cause → effect: each event is triggered by the one before it. Start with what changes first (the trigger), end with the final result or correction.|Pensez cause → effet : chaque événement est déclenché par le précédent. Commencez par ce qui change en premier (le déclencheur), terminez par le résultat ou la correction finale.|Denk in Ursache → Wirkung: Jedes Ereignis wird vom vorherigen ausgelöst. Beginne mit dem, was sich zuerst ändert (dem Auslöser), und ende mit dem Endergebnis oder der Korrektur.",
  d6:{react:"Read the two molecules and spot the change (phosphate added? hydrogen removed? CO₂ lost?). The enzyme is usually named after the molecule plus that change.|Lisez les deux molécules et repérez le changement (phosphate ajouté ? hydrogène retiré ? CO₂ perdu ?). L'enzyme porte en général le nom de la molécule plus ce changement.|Lies die beiden Moleküle und finde die Änderung (Phosphat angehängt? Wasserstoff entfernt? CO₂ abgespalten?). Das Enzym heißt meist wie das Molekül plus diese Änderung.",
    enz:"Split the enzyme name: the first part names the molecule it works on, the ending (-kinase, -dehydrogenase, -isomerase…) names the change. Look for the reaction that matches both.|Découpez le nom de l'enzyme : la première partie nomme la molécule, la fin (-kinase, -déshydrogénase, -isomérase…) nomme le changement. Cherchez la réaction qui correspond aux deux.|Zerlege den Enzymnamen: Der erste Teil nennt das Molekül, die Endung (-kinase, -dehydrogenase, -isomerase…) die Änderung. Suche die Reaktion, die zu beidem passt.",
    reg:"Ask what the molecule 'means' for the cell. Signs of plenty (ATP, citrate, NADH, the pathway's own product) slow a breakdown pathway down. Signs of need (AMP, ADP, the pathway's starting material) speed it up.|Demandez-vous ce que la molécule « signifie » pour la cellule. Les signes d'abondance (ATP, citrate, NADH, le produit de la voie) freinent une voie de dégradation. Les signes de besoin (AMP, ADP, le substrat de départ) l'accélèrent.|Frag, was das Molekül für die Zelle „bedeutet“. Zeichen von Überfluss (ATP, Citrat, NADH, das eigene Produkt) bremsen einen Abbauweg. Zeichen von Bedarf (AMP, ADP, das Ausgangsmaterial) beschleunigen ihn.",
    cof:"Match the cofactor to the kind of chemistry: dehydrogenases → NAD⁺ or FAD; carboxylases → biotin; decarboxylation of α-keto acids → TPP; moving amino groups → PLP; one-carbon transfers → folate or B12.|Associez le cofacteur au type de chimie : déshydrogénases → NAD⁺ ou FAD ; carboxylases → biotine ; décarboxylation des α-cétoacides → TPP ; transfert de groupes aminés → PLP ; transferts d'un carbone → folate ou B12.|Ordne den Cofaktor der Chemie zu: Dehydrogenasen → NAD⁺ oder FAD; Carboxylasen → Biotin; Decarboxylierung von α-Ketosäuren → TPP; Aminogruppen übertragen → PLP; Ein-Kohlenstoff-Übertragungen → Folat oder B12.",
    clin:"If the enzyme is missing, its substrate piles up (and spills into side routes) and its product runs short. The symptoms come from that build-up and that shortage.|Si l'enzyme manque, son substrat s'accumule (et part vers des voies annexes) et son produit vient à manquer. Les symptômes viennent de cette accumulation et de ce manque.|Fehlt das Enzym, staut sich sein Substrat (und weicht auf Nebenwege aus) und sein Produkt wird knapp. Die Symptome kommen von diesem Stau und diesem Mangel.",
    rl:"The rate-limiting enzyme is usually the first committed, one-way step – the point of no return – and the one hormones regulate.|L'enzyme limitante est en général la première étape engagée et à sens unique – le point de non-retour – et celle que les hormones régulent.|Das Schrittmacherenzym ist meist der erste festgelegte Einbahnschritt – der Punkt ohne Rückkehr – und der Ort, an dem Hormone regulieren.",
    loc:"Fuel breakdown that needs oxygen (Krebs cycle, β-oxidation, PDH) happens in the mitochondrial matrix. Glycolysis and most building of fats and sugars happen in the cytosol. Pathways that switch sides need transporters (shuttles).|La dégradation qui utilise l'oxygène (cycle de Krebs, β-oxydation, PDH) a lieu dans la matrice mitochondriale. La glycolyse et la plupart des synthèses de graisses et de sucres ont lieu dans le cytosol. Les voies qui changent de compartiment ont besoin de transporteurs (navettes).|Abbau mit Sauerstoff (Citratzyklus, β-Oxidation, PDH) findet in der Mitochondrienmatrix statt. Glykolyse und die meisten Aufbauwege für Fette und Zucker laufen im Zytosol. Wege, die das Kompartiment wechseln, brauchen Transporter (Shuttles)."},
  d7:"Look at the neighbours of each gap: the molecule before it, the enzyme name and what else happens in that step. Together they tell you what the missing piece must be.|Regardez les voisins de chaque trou : la molécule d'avant, le nom de l'enzyme et ce qui se passe d'autre à cette étape. Ensemble, ils indiquent la pièce manquante.|Schau dir die Nachbarn jeder Lücke an: das Molekül davor, den Enzymnamen und was sonst in diesem Schritt passiert. Zusammen verraten sie das fehlende Teil.",
  d8:["Underline the key findings (age, timing, what makes it worse, lab values). Ask which pathway is blocked or overwhelmed.|Soulignez les éléments clés (âge, moment, facteurs aggravants, analyses). Demandez-vous quelle voie est bloquée ou débordée.|Unterstreiche die Schlüsselbefunde (Alter, Zeitpunkt, was verschlimmert, Laborwerte). Frag dich, welcher Weg blockiert oder überlastet ist.",
    "A block means what comes before it piles up and what comes after it runs short. Match each symptom to one of the two.|Un blocage signifie que ce qui précède s'accumule et que ce qui suit manque. Rattachez chaque symptôme à l'un des deux.|Eine Blockade heißt: Was davor kommt, staut sich, und was danach kommt, fehlt. Ordne jedes Symptom einem von beiden zu."],
  d9:"Count in three parts: (1) ATP made directly, (2) electron carriers × their value (NADH ≈ 2.5, FADH₂ ≈ 1.5), (3) minus the ATP spent to start (activation, transport). Write each part down before adding.|Comptez en trois parties : (1) l'ATP fabriqué directement, (2) les transporteurs d'électrons × leur valeur (NADH ≈ 2,5, FADH₂ ≈ 1,5), (3) moins l'ATP dépensé au départ (activation, transport). Notez chaque partie avant d'additionner.|Zähle in drei Teilen: (1) direkt gebildetes ATP, (2) Elektronenträger × ihr Wert (NADH ≈ 2,5, FADH₂ ≈ 1,5), (3) minus das ATP, das zum Start verbraucht wird (Aktivierung, Transport). Schreib jeden Teil auf, bevor du addierst.",
  bx:{mcq:"Rule out the options that cannot be true first, then compare the last two against the key word in the question.|Éliminez d'abord les options impossibles, puis comparez les deux dernières au mot-clé de la question.|Streiche zuerst die unmöglichen Optionen und vergleiche dann die letzten beiden mit dem Schlüsselwort der Frage.",
    num:"Write the formula first, put each number in with its unit, and check that the units cancel to the unit asked for. Then ask: is the size of the answer sensible?|Écrivez d'abord la formule, placez chaque nombre avec son unité et vérifiez que les unités se simplifient pour donner celle demandée. Puis demandez-vous si l'ordre de grandeur est plausible.|Schreib zuerst die Formel, setz jede Zahl mit Einheit ein und prüfe, ob sich die Einheiten zur gesuchten Einheit kürzen. Frag dich dann: Ist die Größenordnung plausibel?",
    sort:"For each item, ask one yes/no question that separates the groups (e.g. 'Does it carry a charge?'). Do the easy ones first.|Pour chaque élément, posez une question oui/non qui sépare les groupes (par ex. « porte-t-il une charge ? »). Faites d'abord les plus faciles.|Stell für jedes Element eine Ja/Nein-Frage, die die Gruppen trennt (z. B. „Ist es geladen?“). Mach die leichten zuerst.",
    build:"Build it like a sentence: the core first, then what attaches to it, then the bonds that hold the parts together.|Construisez comme une phrase : d'abord le noyau, puis ce qui s'y attache, puis les liaisons qui tiennent les parties.|Bau es wie einen Satz: zuerst der Kern, dann was daran hängt, dann die Bindungen, die die Teile verbinden.",
    pred:"Change one thing at a time: what does the first variable do directly? Then ask how the body responds (reflexes and compensation) and follow the arrows.|Changez une chose à la fois : quel est l'effet direct sur la première variable ? Puis demandez-vous comment le corps réagit (réflexes, compensation) et suivez les flèches.|Ändere eine Sache nach der anderen: Was bewirkt die erste Größe direkt? Frag dann, wie der Körper reagiert (Reflexe, Kompensation), und folge den Pfeilen.",
    ord:"Think cause → effect: each event is triggered by the one before it. Start with the trigger, end with the final result or correction.|Pensez cause → effet : chaque événement est déclenché par le précédent. Commencez par le déclencheur, terminez par le résultat ou la correction finale.|Denk in Ursache → Wirkung: Jedes Ereignis wird vom vorherigen ausgelöst. Beginne mit dem Auslöser, ende mit dem Endergebnis oder der Korrektur.",
    cmp:"Fill one row at a time across all columns: comparing side by side makes the differences stand out.|Remplissez une ligne à la fois pour toutes les colonnes : la comparaison côte à côte fait ressortir les différences.|Fülle eine Zeile nach der anderen über alle Spalten aus: Im direkten Vergleich fallen die Unterschiede auf.",
    mol:"Scan the drawing in this order: count the carbons, find the charged ends (–COO⁻, –NH₃⁺, phosphates), then look for the one feature that tells it apart (C=O position, an extra OH, a ring, a double bond).|Parcourez le dessin dans cet ordre : comptez les carbones, repérez les extrémités chargées (–COO⁻, –NH₃⁺, phosphates), puis cherchez le détail qui la distingue (position du C=O, OH en plus, cycle, double liaison).|Lies die Zeichnung in dieser Reihenfolge: Kohlenstoffe zählen, geladene Enden finden (–COO⁻, –NH₃⁺, Phosphate), dann das eine Unterscheidungsmerkmal suchen (Lage des C=O, zusätzliche OH, Ring, Doppelbindung).",
    grp:"Look at the atoms directly bonded to the highlighted part: what is attached to the C=O (O, S, N, or C?) and is there a phosphorus? That decides the name.|Regardez les atomes directement liés à la partie surlignée : qu'est-ce qui est attaché au C=O (O, S, N ou C ?) et y a-t-il un phosphore ? C'est ce qui détermine le nom.|Schau auf die Atome direkt an der markierten Stelle: Was hängt am C=O (O, S, N oder C?) und ist ein Phosphor dabei? Das bestimmt den Namen.",
    rxn:"Compare left and right atom by atom: count the carbons (CO₂ lost?), the hydrogens and C=O / C–OH (oxidized or reduced?), phosphates and water. One or two differences give the reaction type.|Comparez gauche et droite atome par atome : comptez les carbones (CO₂ perdu ?), les hydrogènes et les C=O / C–OH (oxydé ou réduit ?), les phosphates et l'eau. Une ou deux différences donnent le type de réaction.|Vergleiche links und rechts Atom für Atom: Kohlenstoffe zählen (CO₂ verloren?), Wasserstoffe und C=O / C–OH (oxidiert oder reduziert?), Phosphate und Wasser. Ein oder zwei Unterschiede ergeben den Reaktionstyp.",
    graph:"Read the axes first, then find the reference curve. Ask: did the curve move left/right (sensitivity), up/down (maximum), or change shape?|Lisez d'abord les axes, puis repérez la courbe de référence. Demandez-vous : la courbe s'est-elle déplacée à gauche/droite (sensibilité), en haut/en bas (maximum), ou a-t-elle changé de forme ?|Lies zuerst die Achsen und finde die Referenzkurve. Frag dich: Hat sich die Kurve nach links/rechts (Empfindlichkeit), oben/unten (Maximum) verschoben oder ihre Form geändert?"}
};

const STATEPLAIN = {
  fed:"Fed: you have just eaten. Insulin is high, so the body stores fuel: glycogen in liver and muscle, fat in adipose tissue, and cells burn glucose.|Nourri : vous venez de manger. L'insuline est haute, le corps stocke : glycogène dans le foie et le muscle, graisses dans le tissu adipeux, et les cellules brûlent du glucose.|Resorptionsphase: Du hast gerade gegessen. Insulin ist hoch, der Körper speichert: Glykogen in Leber und Muskel, Fett im Fettgewebe, und die Zellen verbrennen Glucose.",
  post:"Post-absorptive: overnight, no recent meal. Glucagon starts to rise; the liver keeps blood glucose up mainly by breaking down glycogen, and fat begins to be released.|Post-absorptif : la nuit, pas de repas récent. Le glucagon commence à monter ; le foie maintient la glycémie surtout en dégradant son glycogène, et les graisses commencent à être libérées.|Postabsorptiv: über Nacht, keine Mahlzeit. Glucagon steigt; die Leber hält den Blutzucker vor allem durch Glykogenabbau, und Fett wird zunehmend freigesetzt.",
  fast:"Prolonged fast (1–3 days): liver glycogen is used up. The liver makes new glucose (gluconeogenesis) from amino acids, lactate and glycerol, and starts making ketone bodies from fat.|Jeûne prolongé (1–3 jours) : le glycogène du foie est épuisé. Le foie fabrique du glucose neuf (néoglucogenèse) à partir d'acides aminés, de lactate et de glycérol, et commence à produire des corps cétoniques à partir des graisses.|Längeres Fasten (1–3 Tage): Das Leberglykogen ist aufgebraucht. Die Leber bildet neue Glucose (Glukoneogenese) aus Aminosäuren, Laktat und Glycerin und beginnt, aus Fett Ketonkörper zu machen.",
  starv:"Starvation (more than a week): to save muscle protein, the brain switches to ketone bodies for most of its energy, and fat becomes the main fuel.|Inanition (plus d'une semaine) : pour épargner les protéines musculaires, le cerveau passe aux corps cétoniques pour l'essentiel de son énergie, et les graisses deviennent le carburant principal.|Hungerzustand (über eine Woche): Um Muskelprotein zu sparen, deckt das Gehirn den Großteil seiner Energie mit Ketonkörpern, und Fett wird zum Hauptbrennstoff.",
  sprint:"Sprint: maximal effort for seconds to minutes. There is no time for oxygen-based burning, so muscle uses phosphocreatine and anaerobic glycolysis (→ lactate).|Sprint : effort maximal de quelques secondes à minutes. Pas le temps d'utiliser l'oxygène : le muscle utilise la phosphocréatine et la glycolyse anaérobie (→ lactate).|Sprint: Maximalbelastung über Sekunden bis Minuten. Keine Zeit für Verbrennung mit Sauerstoff, also nutzt der Muskel Kreatinphosphat und anaerobe Glykolyse (→ Laktat).",
  endur:"Endurance: long, moderate effort. Oxygen is available, so muscle burns glucose and more and more fat in its mitochondria; adrenaline and glucagon release fuel.|Endurance : effort long et modéré. L'oxygène est disponible : le muscle brûle du glucose puis de plus en plus de graisses dans ses mitochondries ; l'adrénaline et le glucagon libèrent du carburant.|Ausdauer: lange, mäßige Belastung. Sauerstoff ist da, also verbrennt der Muskel Glucose und zunehmend Fett in seinen Mitochondrien; Adrenalin und Glucagon setzen Brennstoff frei."
};
const MISTX = {
  first:"{x} is the very first step: {a} is where the pathway starts – no other card makes it.|{x} est la toute première étape : {a} est le point de départ – aucune autre carte ne le fabrique.|{x} ist der allererste Schritt: Mit {a} beginnt der Weg – keine andere Karte bildet es.",

/* ---------- text helpers for SVG ---------- */
function vWrap(s, max){
  const toks = [];
  String(s).split(/\s+/).filter(Boolean).forEach(w => {
    while (w.length > max){ let k = Math.max(w.lastIndexOf('-', max - 1), w.lastIndexOf('/', max - 1)); if (k < 3) k = max - 2; toks.push(w.slice(0, k + 1)); w = w.slice(k + 1); }
    toks.push(w); });
  const lines = []; let cur = '';
  toks.forEach(t => { const glue = cur && !/[-\/]$/.test(cur) ? ' ' : ''; if (cur && (cur + glue + t).length > max){ lines.push(cur); cur = t; } else cur = cur + glue + t; });
  if (cur) lines.push(cur);
  return lines.length ? lines : [''];
}

/* lines centred on (x, y0 = baseline of first line) */
function vText(lines, x, y0, lh, cls, tok){ return `<text class="${cls}" x="${x}" y="${y0}" text-anchor="middle">` + lines.map((l, i) => `<tspan x="${x}"${i ? ` dy="${lh}"` : ''}>${tok ? vTokLine(l) : esc(l)}</tspan>`).join('') + `</text>`; }
function enzShort(id){ const s = enz(id); const m = s.match(/^(.*?)\s*\(([^)]*)\)\s*$/); return m && /\s/.test(m[2]) && m[1].length > 2 ? m[1] : s; }
function vMarkers(){ return `<defs>` + ['c', 'm', 'imm', 'omm', 'er', 'ly', 'x', 'ink', 'good', 'bad'].map(k =>
  `<marker id="vah-${k}" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path class="vah vah-${k}" d="M0,0 L10,5 L0,10 z"/></marker>`).join('') + `</defs>`; }

function vBez(p0, p1, p2, p3, t){ const u1 = 1 - t; return [0, 1].map(k => u1*u1*u1*p0[k] + 3*u1*u1*t*p1[k] + 3*u1*t*t*p2[k] + t*t*t*p3[k]); }

function vPill(p, i, maxW){ const s = p.st[i], ch = Math.max(10, Math.floor((maxW - 16)/(P_FS*0.56)));

  const rl = s[5] && s[5].indexOf('r') >= 0; if (rl) el[0] = '⏱ ' + el[0];

  const edges = m.ed.map((e, i) => { const o = e[3] || {}, lab = e[2] ? vWrap(omLbl(e[2]), 15).slice(0, 3) : null;
    const lw = lab ? Math.max(...lab.map(l => vTW(l, 10.5))) + 10 : 0, lh = lab ? 6 + lab.length*12.5 : 0;
    if (!e[0]){ return {i, t:e[2], lab, lw, lh, px:o.at[0], py:o.at[1], solo:true}; }
    const A = nodes[e[0]], B = nodes[e[1]];
    let C; if (o.v) C = o.v; else { const mx_ = (A.x + B.x)/2, my = (A.y + B.y)/2, dx = B.x - A.x, dy = B.y - A.y, L_ = Math.hypot(dx, dy) || 1, c = o.c || 0; C = [mx_ - dy/L_*c, my + dx/L_*c]; }
    const clip = (N, tx, ty, pad) => { const dx = tx - N.x, dy = ty - N.y; const t = Math.min((N.w/2 + pad)/Math.abs(dx || 1e-6), (N.h/2 + pad)/Math.abs(dy || 1e-6)); return [N.x + dx*t, N.y + dy*t]; };
    const P0 = clip(A, C[0], C[1], 2), P2 = clip(B, C[0], C[1], 4);
    const d = `M${P0[0].toFixed(1)},${P0[1].toFixed(1)} Q${C[0].toFixed(1)},${C[1].toFixed(1)} ${P2[0].toFixed(1)},${P2[1].toFixed(1)}`;
    const px = (P0[0] + 2*C[0] + P2[0])/4, py = (P0[1] + 2*C[1] + P2[1])/4;

function newV2map(mid, cnt){

  const s = S.v2 = Object.assign(prev, {mid:m.id, cnt, B:{}, active:null, checked:false, bank:[], num:{}, order:[], msg:null});
  if (s.study) return;
  const Lo = omLayout(m), cand = [];
  for (const id in Lo.nodes) cand.push({key:'n' + id, kind:Lo.nodes[id].k, t:Lo.nodes[id].t, pos:[Lo.nodes[id].y, Lo.nodes[id].x]});
  Lo.edges.forEach(e => { if (e.lab) cand.push({key:'l' + e.i, kind:'p', t:e.t, pos:[e.py, e.px]}); });
  /* one gap per distinct label so the answer is never visible elsewhere in the map */
  const groups = {}; cand.forEach(c => { const g = TEN(c.t); (groups[g] = groups[g] || []).push(c); });
  let gs = shuffle(Object.keys(groups)); if (cnt) gs = gs.slice(0, cnt);
  let uid = 0; const keyOf = t => 'L:' + TEN(t);
  gs.forEach(g => groups[g].forEach(c => { s.B[c.key] = {kind:'p', ans:c.t, val:null, state:null}; s.bank.push({u:'o' + (uid++), kind:'p', v:c.t, key:keyOf(c.t), k2:c.kind}); }));
  const here = cand.map(c => keyOf(c.t)), pool = [];
  OMAPS.forEach(x => { if (x.id === m.id) return; for (const id in x.nd) pool.push({kind:'p', v:x.nd[id][2], key:keyOf(x.nd[id][2]), k2:x.nd[id][3]}); x.ed.forEach(e => { if (e[2]) pool.push({kind:'p', v:e[2], key:keyOf(e[2]), k2:'p'}); }); });
  const nAns = s.bank.length, k = cnt ? Math.max(2, Math.ceil(nAns/2)) : Math.min(6, Math.max(3, Math.ceil(nAns/3)));
  vPool(pool, here, k).forEach(d => s.bank.push(Object.assign({u:'o' + (uid++)}, d)));
  s.bank = shuffle(s.bank);
  const POS = {}; cand.forEach(c => POS[c.key] = c.pos);
  s.order = Object.keys(s.B).sort((a, b) => (POS[a][0] - POS[b][0]) || (POS[a][1] - POS[b][1])); s.order.forEach((k_, i) => s.num[k_] = i + 1);
  s.active = s.order[0] || null;
}
